name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - ubuntu-22.04
          - macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Scriptorium {0}', github.ref_name) || '' }}
          releaseBody: Release build of Scriptorium.
          releaseDraft: false
          prerelease: false

      # The app spawns node server.js, so the raw exe alone cannot run. Build a
      # portable package with the exe, the server, its assets and node.exe.
      - name: Build portable Windows package
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="Scriptorium_${VERSION}_x64_portable"
          mkdir -p "${DIR}"
          cp src-tauri/target/release/scriptorium.exe "${DIR}/Scriptorium.exe"
          cp "$(which node)" "${DIR}/node.exe"
          cp server.js package.json "${DIR}/"
          cp -r public locales node_modules "${DIR}/"
          powershell -Command "Compress-Archive -Path '${DIR}' -DestinationPath '${DIR}.zip' -Force"
          gh release upload "$GITHUB_REF_NAME" "${DIR}.zip" --clobber
