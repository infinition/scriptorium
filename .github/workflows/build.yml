name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - ubuntu-22.04
          - macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      # Bundle a node runtime next to the server so the packaged app runs on a
      # machine without node installed. The file lands in Resources/bundle-node
      # and the Rust shell spawns it (see lib.rs).
      - name: Bundle node runtime
        shell: bash
        run: |
          mkdir -p src-tauri/bundle-node
          NODE_VERSION=v20.19.0
          case "${{ matrix.platform }}" in
            macos-latest) NODE_OS=darwin;  NODE_ARCH=arm64; EXT=tar.gz; BIN=bin/node;   OUT=node;;
            ubuntu-22.04) NODE_OS=linux;   NODE_ARCH=x64;   EXT=tar.gz; BIN=bin/node;   OUT=node;;
            windows-latest) NODE_OS=win;   NODE_ARCH=x64;   EXT=zip;    BIN=node.exe;  OUT=node.exe;;
          esac
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-${NODE_OS}-${NODE_ARCH}.${EXT}" -o node_bin.${EXT}
          if [ "${EXT}" = "zip" ]; then
            unzip -o node_bin.zip "node-${NODE_VERSION}-${NODE_OS}-${NODE_ARCH}/${BIN}"
            cp "node-${NODE_VERSION}-${NODE_OS}-${NODE_ARCH}/${BIN}" "src-tauri/bundle-node/${OUT}"
          else
            tar -xzf node_bin.${EXT} "node-${NODE_VERSION}-${NODE_OS}-${NODE_ARCH}/${BIN}"
            cp "node-${NODE_VERSION}-${NODE_OS}-${NODE_ARCH}/${BIN}" "src-tauri/bundle-node/${OUT}"
            chmod +x "src-tauri/bundle-node/${OUT}"
          fi

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Scriptorium {0}', github.ref_name) || '' }}
          releaseBody: Release build of Scriptorium.
          releaseDraft: false
          prerelease: false

      # A single self-contained Windows exe: the app binary with the server,
      # its assets, node_modules and node.exe compressed and appended to it.
      - name: Build self-contained Windows exe
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$(which node)" node.exe
          tar -czf payload.tar.gz server.js package.json public locales node_modules node.exe
          rm -f node.exe
          cp src-tauri/target/release/scriptorium.exe "Scriptorium_${VERSION}_x64.exe"
          printf '\x00SCRI_PORTABLE_PAYLOAD\x00' >> "Scriptorium_${VERSION}_x64.exe"
          cat payload.tar.gz >> "Scriptorium_${VERSION}_x64.exe"
          rm -f payload.tar.gz
          gh release upload "$GITHUB_REF_NAME" "Scriptorium_${VERSION}_x64.exe" --clobber

      # Tauri names the macOS .app.tar.gz without the version. Rename it so
      # every asset carries the version.
      - name: Version the macOS tar.gz
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OLD="Scriptorium_aarch64.app.tar.gz"
          NEW="Scriptorium_${VERSION}_aarch64.app.tar.gz"
          FILE=$(find src-tauri/target/release/bundle -name "*.app.tar.gz" | head -1)
          cp "$FILE" "$NEW"
          gh release delete-asset "$GITHUB_REF_NAME" "$OLD" --yes || true
          gh release upload "$GITHUB_REF_NAME" "$NEW" --clobber
