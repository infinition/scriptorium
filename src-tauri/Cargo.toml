[package]
name = "scriptorium"
version = "1.3.1"
description = "Distraction-free markdown editor reading and writing .md files on your own disk."
authors = ["Scriptorium"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
flate2 = "1"
tar = "0.4"
dirs = "5"
# In-app update. The process plugin is what restarts the app once the new
# version is installed.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Required in scope by generate_context! once a capabilities file exists.
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
